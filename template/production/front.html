<div class="container">

    <div class="badge">
        Production · 🇫🇷 → 🇱🇺
    </div>

    <div class="main">
        {{Traduction}}
    </div>

    <div class="typing-section">

        <div class="typing-label">
            Réponse écrite
            <span class="typing-optional">Facultatif</span>
        </div>

        <div class="typing-input">
            {{type:Mot}}
        </div>

    </div>

</div>

<script>
setTimeout(() => {
    const input = document.querySelector("#typeans");

    if (input) {
        input.placeholder = "Écris en luxembourgeois…";
        input.setAttribute("autocomplete", "off");
        input.setAttribute("autocorrect", "off");
        input.setAttribute("autocapitalize", "off");
        input.setAttribute("spellcheck", "false");
    }
}, 0);
</script>
